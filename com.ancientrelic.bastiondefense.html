<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MARJPMPRO</title>
  <!-- Global builds: Vue 3, Vue Router 4, js-md5 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
  <style>
    /* ============================================================
       THEME: Cyberpunk (风格 19) — 固定写死
       深黑底 + 霓虹荧光 + 发光边框，未来科技感
       ============================================================ */
    :root {
      --bg: #0a0a12;
      --bg-deep: #06060c;
      --surface: rgba(18, 18, 32, 0.85);
      --surface-solid: #121220;
      --surface-secondary: rgba(26, 26, 48, 0.6);
      --text-primary: #e8f0ff;
      --text-secondary: #8fa8c8;
      --text-muted: #5a6e8c;
      --accent: #00f0ff;
      --accent-alt: #ff00e5;
      --accent-soft: rgba(0, 240, 255, 0.1);
      --accent-gradient: linear-gradient(135deg, #00f0ff, #ff00e5);
      --success: #00ff9d;
      --danger: #ff2d6f;
      --warning: #ffcc00;
      --border-light: rgba(0, 240, 255, 0.15);
      --border-glow: rgba(0, 240, 255, 0.35);
      --shadow-sm: 0 0 12px rgba(0, 240, 255, 0.08);
      --shadow-md: 0 0 24px rgba(0, 240, 255, 0.12);
      --shadow-glow: 0 0 20px rgba(0, 240, 255, 0.25), 0 0 40px rgba(255, 0, 229, 0.1);
      --radius-card: 16px;
      --radius-btn: 12px;
      --radius-input: 10px;
      --space-xs: 6px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --tab-height: 64px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --font-mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg-deep);
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(0, 240, 255, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(255, 0, 229, 0.05) 0%, transparent 50%);
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      color: var(--text-primary);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    /* ----- Page container ----- */
    .page-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: var(--space-md);
      padding-top: calc(var(--space-md) + var(--safe-top));
      padding-bottom: 8px;
    }

    /* ----- Tab bar ----- */
    .tab-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: rgba(10, 10, 20, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-glow);
      padding: 4px 0 calc(4px + var(--safe-bottom));
      height: calc(var(--tab-height) + var(--safe-bottom));
      flex-shrink: 0;
      box-shadow: 0 -2px 20px rgba(0, 240, 255, 0.1);
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 44px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s, text-shadow 0.2s;
      gap: 3px;
      border: none;
      background: none;
      cursor: pointer;
    }

    .tab-item.active {
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent), 0 0 20px rgba(0, 240, 255, 0.5);
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      transition: filter 0.2s;
    }

    .tab-item.active svg {
      filter: drop-shadow(0 0 6px var(--accent));
    }

    /* ----- Cards ----- */
    .card {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-card);
      padding: var(--space-md);
      box-shadow: var(--shadow-sm);
      margin-bottom: var(--space-md);
      border: 1px solid var(--border-light);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }

    .page-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
      color: var(--text-primary);
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }

    .page-sub {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      letter-spacing: 0.04em;
    }

    /* ----- Button ----- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 20px;
      border-radius: var(--radius-btn);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid var(--accent);
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: var(--accent);
      width: 100%;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2), inset 0 0 12px rgba(0, 240, 255, 0.05);
    }
    .btn:active {
      transform: scale(0.97);
      background: var(--accent-soft);
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.15);
    }
    .btn:disabled {
      opacity: 0.3;
      pointer-events: none;
      box-shadow: none;
      border-color: var(--text-muted);
      color: var(--text-muted);
    }

    /* ----- Inputs ----- */
    .input-field {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: var(--radius-input);
      border: 1px solid var(--border-light);
      font-size: 15px;
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: var(--space-sm);
    }
    .input-field::placeholder {
      color: var(--text-muted);
    }
    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft), 0 0 16px rgba(0, 240, 255, 0.15);
    }
    textarea.input-field {
      min-height: 100px;
      resize: vertical;
      font-family: inherit;
    }

    /* ----- Stock list ----- */
    .stock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 4px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.08);
      min-height: 56px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .stock-row:last-child {
      border-bottom: none;
    }
    .stock-row:active {
      background: rgba(0, 240, 255, 0.05);
    }
    .stock-symbol {
      font-weight: 700;
      font-size: 16px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
    }
    .stock-name {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
      letter-spacing: 0.02em;
    }
    .stock-price {
      font-weight: 600;
      font-size: 16px;
      text-align: right;
      font-family: var(--font-mono);
    }
    .stock-change {
      font-size: 12px;
      font-weight: 700;
      text-align: right;
      margin-top: 2px;
      font-family: var(--font-mono);
    }
    .up {
      color: var(--success);
      text-shadow: 0 0 8px rgba(0, 255, 157, 0.5);
    }
    .down {
      color: var(--danger);
      text-shadow: 0 0 8px rgba(255, 45, 111, 0.5);
    }

    /* ----- Quick actions ----- */
    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: var(--space-md);
    }
    .quick-item {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius-card);
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      text-decoration: none;
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      min-height: 96px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .quick-item::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: var(--accent-gradient);
      opacity: 0.6;
      border-radius: 2px;
    }
    .quick-item:active {
      transform: scale(0.97);
      box-shadow: var(--shadow-glow);
      border-color: var(--accent);
    }
    .quick-item svg {
      width: 26px;
      height: 26px;
      stroke: var(--accent);
      stroke-width: 1.8;
      fill: none;
      filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.6));
    }

    /* ----- Toolbox ----- */
    .tool-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tool-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius-card);
      padding: 14px 16px;
      border: 1px solid var(--border-light);
      min-height: 64px;
      text-decoration: none;
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }
    .tool-item:active {
      transform: scale(0.98);
      border-color: var(--accent);
      box-shadow: var(--shadow-glow);
    }
    .tool-icon {
      width: 44px;
      height: 44px;
      background: rgba(0, 240, 255, 0.08);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }
    .tool-icon svg {
      width: 22px;
      height: 22px;
      stroke: var(--accent);
      stroke-width: 1.8;
      fill: none;
    }
    .tool-name {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.02em;
    }
    .tool-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* ----- Settings ----- */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      padding: 12px 4px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.08);
      cursor: pointer;
      text-decoration: none;
      color: var(--text-primary);
      transition: background 0.15s;
    }
    .setting-row:last-child {
      border-bottom: none;
    }
    .setting-row:active {
      background: rgba(0, 240, 255, 0.05);
    }
    .setting-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.02em;
    }
    .setting-label svg {
      width: 20px;
      height: 20px;
      stroke: var(--accent);
      stroke-width: 1.8;
      fill: none;
      filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.5));
    }
    .setting-value {
      color: var(--text-muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
    }
    .chevron {
      color: var(--accent);
      font-size: 18px;
      line-height: 1;
      opacity: 0.7;
    }

    /* ----- Calendar ----- */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 12px;
    }
    .calendar-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--surface-secondary);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .calendar-cell.checked {
      background: transparent;
      color: var(--accent);
      font-weight: 700;
      border: 1px solid var(--accent);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.1);
      text-shadow: 0 0 8px var(--accent);
    }
    .calendar-cell.empty {
      background: transparent;
    }

    /* ----- Modal ----- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 999;
      animation: fadeIn 0.2s;
    }
    .modal-card {
      background: var(--surface-solid);
      border-radius: var(--radius-card);
      padding: 24px;
      max-width: 400px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: var(--shadow-glow);
      border: 1px solid var(--border-glow);
      animation: slideUp 0.25s ease-out;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
      letter-spacing: 0.02em;
    }
    .modal-body {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 16px;
      white-space: pre-line;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* ----- Loading ----- */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 28px;
      padding: 40px;
      text-align: center;
    }
    .loading-logo {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent), 0 0 40px rgba(0, 240, 255, 0.5), 0 0 60px rgba(255, 0, 229, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .loading-spinner {
      width: 44px;
      height: 44px;
      border: 2px solid rgba(0, 240, 255, 0.15);
      border-top-color: var(--accent);
      border-right-color: var(--accent-alt);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ----- Utility ----- */
    .text-muted { color: var(--text-muted); }
    .text-sm { font-size: 12px; }
    .mt-2 { margin-top: 8px; }
    .mt-4 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .hash-box {
      background: rgba(0, 0, 0, 0.4);
      border-radius: var(--radius-input);
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      word-break: break-all;
      color: var(--accent);
      margin: 8px 0;
      border: 1px solid var(--border-light);
      line-height: 1.7;
      box-shadow: inset 0 0 12px rgba(0, 240, 255, 0.05);
    }

    /* Transition */
    .fade-enter-active, .fade-leave-active {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .fade-enter-from {
      opacity: 0;
      transform: translateY(8px);
    }
    .fade-leave-to {
      opacity: 0;
      transform: translateY(-8px);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body>
  <div id="app">
    <router-view v-slot="{ Component }">
      <transition name="fade" mode="out-in">
        <component :is="Component" />
      </transition>
    </router-view>

    <nav class="tab-bar" v-if="showTabBar">
      <router-link to="/home" class="tab-item" active-class="active">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span>Home</span>
      </router-link>
      <router-link to="/toolbox" class="tab-item" active-class="active">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
        </svg>
        <span>Toolbox</span>
      </router-link>
      <router-link to="/settings" class="tab-item" active-class="active">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04a1.65 1.65 0 0 0 1.51 1h12.7a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0 .33-1.82z" />
          <path d="M19.4 9a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04a1.65 1.65 0 0 0 1.51 1h12.7a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0 .33-1.82z" />
        </svg>
        <span>Settings</span>
      </router-link>
    </nav>
  </div>

  <script>
    /*
     * ============================================================
     * HOW TO ADD A NEW PAGE:
     * 1. Define a new component object (template + setup) below.
     * 2. Add a route entry to the `routes` array.
     * 3. If it's a main tab page, add a <router-link> in the
     *    .tab-bar HTML and include its path in `showTabBar`.
     * ============================================================
     */

    (function () {
      const { createApp, ref, computed, onMounted } = Vue;
      const { createRouter, createWebHashHistory, useRouter, useRoute } = VueRouter;

      /* ============================================================
       * INLINE SVG ICONS
       * ============================================================ */
      const Icons = {
        chart: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
        trendUp: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
        trendDown: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>`,
        star: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,

        { path: '/home/stock/:symbol', component: StockDetailPage },
        { path: '/toolbox', component: ToolboxPage },
        { path: '/toolbox/dca', component: DcaTool },
        { path: '/toolbox/calendar', component: WealthCalendarTool },
        { path: '/toolbox/loan', component: LoanTool },
        { path: '/toolbox/profit', component: ProfitTool },
        { path: '/toolbox/reverse', component: ReverseYieldTool },
        { path: '/toolbox/password', component: PasswordTool },
        { path: '/toolbox/credit', component: CreditMemoTool },
        { path: '/settings', component: SettingsPage },
        { path: '/settings/version', component: VersionPage },
        { path: '/settings/privacy', component: PrivacyPage },
        { path: '/settings/terms', component: TermsPage },
        { path: '/settings/team', component: TeamPage },
        { path: '/settings/checkin', component: CheckinPage },
        { path: '/settings/feedback', component: FeedbackPage },
        { path: '/settings/inbox', component: InboxPage },
        { path: '/:pathMatch(.*)*', redirect: '/home' }
      ];

      const router = createRouter({
        history: createWebHashHistory(),
        routes
      });

      /* ============================================================
       * APP ROOT
       * ============================================================ */
      const app = createApp({
        setup() {
          const showTabBar = computed(() => {
            const p = router.currentRoute.value.path;
            return ['/home', '/toolbox', '/settings'].includes(p);
          });
          return { showTabBar };
        }
      });

      app.use(router);
      app.mount('#app');
    })();
  </script>
</body>
</html>
